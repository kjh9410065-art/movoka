# MOVOKA 공연 데이터를 매일 오전 7시(KST)에 갱신합니다.
name: MOVOKA Daily Performance Refresh

concurrency:
  group: movoka-performance-refresh
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh-performances.mjs'
      - 'scripts/**'
      - '.github/workflows/refresh-performances.yml'
      - 'worker.js'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh, validate, and push with conflict recovery
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/run-refresh.sh

      - name: Verify production deployment
        if: github.ref_name == 'main'
        run: node scripts/verify-deployment.mjs

      - name: Refresh summary
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const d = JSON.parse(await readFile('public/data/performances.json', 'utf8'));
          console.log('MOVOKA refresh and validation completed.');
          console.log('updatedAt:', d.updatedAt);
          console.log('현재 공연:', d.current.length);
          console.log('공연 예정:', d.upcoming.length);
          console.log('전체:', d.items.length);
          NODE


      - name: Failure summary
        if: failure()
        run: echo '::error::갱신 또는 운영 배포 확인 실패. 실패 단계 로그를 확인하세요.'
