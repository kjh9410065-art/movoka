<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="연극, 뮤지컬, 클래식, 국악, 콘서트, 무용, 아동공연 등 공식 공연정보를 한곳에서 찾습니다.">
<title>MOVOKA | 공연·문화 정보</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#171923;--muted:#73798a;--line:#e4e6ed;--p:#5b5bd6;--soft:#eef0ff;--shadow:0 10px 30px rgba(20,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}body.dark{--bg:#0e1016;--card:#181b23;--text:#f4f5f8;--muted:#a3a8b6;--line:#2a2e39;--p:#8b8cff;--soft:#242744;--shadow:0 14px 34px rgba(0,0,0,.25)}
a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{max-width:1200px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;font-size:24px;letter-spacing:-1px}.logo span{color:var(--p)}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer}
.hero{padding:58px 0 30px}.eyebrow{color:var(--p);font-weight:900;font-size:13px;margin-bottom:12px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.06;letter-spacing:-3px;margin:0 0 14px}.hero p{color:var(--muted);line-height:1.7;margin:0}.search{display:flex;gap:10px;margin-top:26px}.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:15px 17px;outline:none}.search button,.primary{border:0;background:var(--p);color:#fff;border-radius:14px;font-weight:850;padding:0 22px;cursor:pointer}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:14px}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 13px;cursor:pointer}.chip.active{background:var(--p);border-color:var(--p);color:#fff}.filters{display:flex;gap:8px}.filters select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px;gap:12px}.count{font-weight:900}.notice{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:70px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.18s}.card:hover{transform:translateY(-3px)}.poster{aspect-ratio:3/4;background:linear-gradient(135deg,var(--soft),var(--card));display:grid;place-items:center;color:var(--muted);font-size:13px}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.tag{display:inline-block;color:var(--p);background:var(--soft);font-size:11px;font-weight:900;border-radius:7px;padding:5px 7px;margin-bottom:9px}.title{font-size:18px;font-weight:900;letter-spacing:-.5px;line-height:1.35;min-height:49px}.meta{display:grid;gap:6px;color:var(--muted);font-size:12px;line-height:1.45;margin-top:10px}.actions{display:flex;gap:7px;margin-top:14px}.actions a,.actions button{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 6px;font-size:12px;font-weight:850;cursor:pointer}.actions .primary{background:var(--p);border-color:var(--p);color:#fff}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:var(--card)}footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:12px;line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;place-items:center;padding:20px;z-index:50}.modal.open{display:grid}.dialog{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;position:relative}.close{position:absolute;right:18px;top:15px;border:0;background:var(--soft);color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}.detail{display:grid;grid-template-columns:220px 1fr;gap:24px}.detail img{width:100%;border-radius:14px}.detail h2{margin:0 40px 10px 0;font-size:28px;letter-spacing:-1.5px}.detail p{color:var(--muted);line-height:1.7}.detail dl{display:grid;grid-template-columns:90px 1fr;gap:9px;font-size:14px}.detail dt{font-weight:900}.detail dd{margin:0;color:var(--muted)}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.filters{overflow:auto}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.detail{grid-template-columns:1fr}.detail img{max-width:240px}.hero{padding-top:42px}}@media(max-width:480px){.wrap{padding:0 14px}.grid{grid-template-columns:1fr 1fr}.title{font-size:15px;min-height:41px}.body{padding:12px}.notice{display:none}}
</style>
</head>
<body>
<header><div class="wrap"><nav><div class="logo">MO<span>V</span>OKA</div><button class="theme" id="theme" aria-label="다크모드">☾</button></nav></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">OFFICIAL CULTURE DISCOVERY</div><h1>지금 볼 공연,<br>한곳에서 찾기.</h1><p>연극 · 뮤지컬 · 클래식 · 국악 · 콘서트 · 무용 · 아동공연까지<br>공식 데이터 기준으로 한곳에서 확인하세요.</p><div class="search"><input id="q" placeholder="공연명이나 공연장을 검색하세요"><button id="go">검색</button></div></section>
<div class="toolbar"><div class="chips" id="chips"></div><div class="filters"><select id="area"><option value="">전국</option><option value="11">서울</option><option value="41">경기</option><option value="26">부산</option><option value="27">대구</option><option value="28">인천</option><option value="29">광주</option><option value="30">대전</option><option value="31">울산</option><option value="36">세종</option><option value="51">강원</option><option value="43">충북</option><option value="44">충남</option><option value="45">전북</option><option value="46">전남</option><option value="47">경북</option><option value="48">경남</option><option value="50">제주</option></select></div></div>
<div class="bar"><div class="count" id="count">공연 정보를 불러오는 중...</div><div class="notice">출처: 공연예술통합전산망(KOPIS) · 공식 데이터만 사용</div></div>
<section class="grid" id="grid"><div class="empty">공연 정보를 불러오는 중입니다.</div></section>
</main>
<footer><div class="wrap">공연정보는 KOPIS 공식 Open API를 통해 조회합니다. 데이터 갱신 시점에 따라 실제 공연·예매 정보와 차이가 있을 수 있습니다.</div></footer>
<div class="modal" id="modal"><div class="dialog"><button class="close" id="close">닫기</button><div id="detail"></div></div></div>
<script>
// KOPIS 공식 장르코드와 지역 필터를 사용합니다.
const categories=[['','전체'],['AAAA','연극'],['GGGA','뮤지컬'],['CCCA','서양음악(클래식)'],['CCCB','한국음악(국악)'],['CCCC','대중음악'],['EEEA','무용(서양/한국무용)'],['EEEB','대중무용'],['GGGC','서커스/마술'],['GGG9','복합'],['JJJA','아동'],['K','축제']];
let active='', data=[];
const $=s=>document.querySelector(s), grid=$('#grid'), count=$('#count');
$('#chips').innerHTML=categories.map((x,i)=>`<button class="chip ${i===0?'active':''}" data-id="${x[0]}">${x[1]}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active=b.dataset.id;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));load()});
$('#go').onclick=load;$('#q').onkeydown=e=>{if(e.key==='Enter')load()};$('#area').onchange=load;
$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('movoka-dark',document.body.classList.contains('dark'))};if(localStorage.getItem('movoka-dark')==='true')document.body.classList.add('dark');
$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function card(x){return `<article class="card"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="${esc(x.prfnm)} 포스터" loading="lazy">`:'포스터 없음'}</div><div class="body"><div class="tag">${esc(x.genrenm||'공연')}</div><div class="title">${esc(x.prfnm||'공연명 미정')}</div><div class="meta"><div>📅 ${esc(x.prfpdfrom||'-')} ~ ${esc(x.prfpdto||'-')}</div><div>📍 ${esc(x.fcltynm||'-')}</div></div><div class="actions"><button onclick="showDetail('${esc(x.mt20id)}')">상세보기</button><a class="primary" href="${esc(x.prfurl||'#')}" target="_blank" rel="noopener noreferrer">KOPIS</a></div></div></article>`}
function render(){const q=$('#q').value.trim().toLowerCase();const list=data.filter(x=>(!q||`${x.prfnm} ${x.fcltynm}`.toLowerCase().includes(q)));count.textContent=`${list.length}개의 공연`;grid.innerHTML=list.length?list.map(card).join(''):'<div class="empty">조건에 맞는 공연이 없습니다.</div>'}
async function load(){grid.innerHTML='<div class="empty">공연 정보를 불러오는 중입니다.</div>';try{const p=new URLSearchParams({rows:'100'});if(active)p.set('shcate',active);if($('#area').value)p.set('signgucode',$('#area').value);const q=$('#q').value.trim();if(q)p.set('shprfnm',q);const r=await fetch('/api/performances?'+p);if(!r.ok)throw 0;const xml=await r.text();const doc=new DOMParser().parseFromString(xml,'text/xml');data=[...doc.querySelectorAll('db')].map(n=>Object.fromEntries(['mt20id','prfnm','prfpdfrom','prfpdto','fcltynm','poster','genrenm','prfurl'].map(k=>[k,n.querySelector(k)?.textContent||''])));render()}catch(e){count.textContent='연결 대기';grid.innerHTML='<div class="empty">KOPIS API 연결 설정이 필요합니다.<br>Cloudflare 환경변수에 KOPIS_API_KEY를 등록하면 공식 공연 데이터가 표시됩니다.</div>'}}
async function showDetail(id){$('#modal').classList.add('open');$('#detail').innerHTML='<p>공식 상세정보를 불러오는 중입니다.</p>';try{const r=await fetch('/api/performance?mt20id='+encodeURIComponent(id));if(!r.ok)throw 0;const xml=await r.text();const d=new DOMParser().parseFromString(xml,'text/xml').querySelector('db');if(!d)throw 0;const get=k=>d.querySelector(k)?.textContent||'';const img=get('poster');$('#detail').innerHTML=`<div class="detail"><div>${img?`<img src="${esc(img)}" alt="${esc(get('prfnm'))}">`:''}</div><div><h2>${esc(get('prfnm'))}</h2><dl><dt>장르</dt><dd>${esc(get('genrenm'))}</dd><dt>기간</dt><dd>${esc(get('prfpdfrom'))} ~ ${esc(get('prfpdto'))}</dd><dt>공연장</dt><dd>${esc(get('fcltynm'))}</dd><dt>시간</dt><dd>${esc(get('prfruntime'))}</dd><dt>관람연령</dt><dd>${esc(get('prfage'))}</dd><dt>가격</dt><dd>${esc(get('pcseguidance'))}</dd><dt>출연진</dt><dd>${esc(get('prfcast'))}</dd><dt>제작진</dt><dd>${esc(get('prfcrew'))}</dd><dt>주최/주관</dt><dd>${esc(get('entrpsnm'))}</dd></dl><p>${esc(get('sty'))}</p><a class="primary" style="display:inline-block;padding:11px 16px" href="${esc(get('prfurl')||'#')}" target="_blank" rel="noopener noreferrer">공식 상세정보</a></div></div>`}catch(e){$('#detail').innerHTML='<p>상세정보를 불러오지 못했습니다.</p>'}}
load();
</script>
</body>
</html>
