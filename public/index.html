<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="연극, 뮤지컬, 클래식, 콘서트 등 공식 공연정보를 한곳에서 찾는 MOVOKA">
<title>MOVOKA | 공연정보</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#171923;--muted:#73798a;--line:#e4e6ed;--primary:#5b5bd6;--soft:#eef0ff;--shadow:0 10px 28px rgba(20,24,40,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}body.dark{--bg:#0e1016;--card:#181b23;--text:#f4f5f8;--muted:#a3a8b6;--line:#2a2e39;--primary:#8b8cff;--soft:#242744;--shadow:0 14px 34px rgba(0,0,0,.25)}
a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{max-width:1200px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;font-size:24px;letter-spacing:-1px}.logo span{color:var(--primary)}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer}
.hero{padding:58px 0 30px}.eyebrow{color:var(--primary);font-weight:900;font-size:12px;letter-spacing:.08em;margin-bottom:12px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.06;letter-spacing:-3px;margin:0 0 14px}.hero p{color:var(--muted);line-height:1.7;margin:0}.search{display:flex;gap:10px;margin-top:26px}.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:15px 17px;outline:none}.search input:focus{border-color:var(--primary)}.search button,.primary{border:0;background:var(--primary);color:#fff;border-radius:14px;font-weight:850;padding:0 22px;cursor:pointer}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:10px}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 13px;cursor:pointer}.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}.filters select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;min-width:110px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px;gap:12px}.count{font-weight:900}.notice{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:70px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.18s}.card:hover{transform:translateY(-3px)}.poster{aspect-ratio:3/4;background:linear-gradient(135deg,var(--soft),var(--card));display:grid;place-items:center;color:var(--muted);font-size:13px}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.tag{display:inline-block;color:var(--primary);background:var(--soft);font-size:11px;font-weight:900;border-radius:7px;padding:5px 7px;margin-bottom:9px}.title{font-size:17px;font-weight:900;letter-spacing:-.5px;line-height:1.4;min-height:48px}.meta{display:grid;gap:6px;color:var(--muted);font-size:12px;line-height:1.45;margin-top:10px}.actions{display:flex;gap:7px;margin-top:14px}.actions a,.actions button{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 6px;font-size:12px;font-weight:850;cursor:pointer}.actions .primary{background:var(--primary);border-color:var(--primary);color:#fff}.actions .ticket{background:var(--text);border-color:var(--text);color:var(--card)}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:var(--card)}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:12px;line-height:1.7}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;z-index:60}.modal.open{display:grid}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;position:relative}.close{position:absolute;right:18px;top:15px;border:0;background:var(--soft);color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}.detail{display:grid;grid-template-columns:220px 1fr;gap:24px}.detail img{width:100%;border-radius:14px}.detail h2{margin:0 40px 12px 0;font-size:28px;letter-spacing:-1.5px}.detail p{color:var(--muted);line-height:1.7}.detail dl{display:grid;grid-template-columns:90px 1fr;gap:9px;font-size:14px}.detail dt{font-weight:900}.detail dd{margin:0;color:var(--muted);word-break:keep-all}.detail .official{display:inline-block;background:var(--primary);color:#fff;border-radius:11px;padding:11px 16px;font-weight:850;margin-top:8px}.ticket-list{display:grid;gap:10px;margin-top:16px}.ticket-list a{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-weight:850}.ticket-list a span{color:var(--primary);font-size:12px}.ticket-list a:hover{border-color:var(--primary)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.toolbar{grid-template-columns:1fr}.filters select{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detail img{max-width:240px}.hero{padding-top:42px}}@media(max-width:480px){.wrap{padding:0 14px}.grid{gap:10px}.body{padding:12px}.title{font-size:15px;min-height:42px}.notice{display:none}.dialog{padding:18px}.detail h2{font-size:23px}}
</style>
</head>
<body>
<header><div class="wrap"><nav><div class="logo">MO<span>V</span>OKA</div><button class="theme" id="theme" aria-label="다크모드 전환">☾</button></nav></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">OFFICIAL CULTURE DISCOVERY</div><h1>지금 볼 공연,<br>한곳에서 찾기.</h1><p>연극 · 뮤지컬 · 클래식 · 콘서트 · 무용 · 아동공연까지<br>공식 데이터 기준으로 한곳에서 확인하세요.</p><div class="search"><input id="q" placeholder="공연명이나 공연장을 검색하세요" autocomplete="off"><button id="go">검색</button></div></section>
<div class="toolbar"><div class="chips" id="chips"></div><div class="filters"><select id="area"><option value="">전국</option><option value="11">서울</option><option value="41">경기</option><option value="26">부산</option><option value="27">대구</option><option value="28">인천</option><option value="29">광주</option><option value="30">대전</option><option value="31">울산</option><option value="36">세종</option><option value="51">강원</option><option value="43">충북</option><option value="44">충남</option><option value="45">전북</option><option value="46">전남</option><option value="47">경북</option><option value="48">경남</option><option value="50">제주</option></select></div></div>
<div class="bar"><div class="count" id="count">공연 정보를 불러오는 중...</div><div class="notice">출처: 공연예술통합전산망(KOPIS) · 공식 데이터만 사용</div></div>
<section class="grid" id="grid"><div class="empty">공연 정보를 불러오는 중입니다.</div></section>
</main>
<footer><div class="wrap">공연정보는 KOPIS 공식 Open API를 통해 조회합니다. 데이터 갱신 시점에 따라 실제 공연·예매 정보와 차이가 있을 수 있습니다.</div></footer>
<div class="modal" id="modal"><div class="dialog"><button class="close" id="close">닫기</button><div id="detail"></div></div></div>
<script>
const categories=[['','전체'],['AAAA','연극'],['GGGA','뮤지컬'],['CCCA','서양음악(클래식)'],['CCCB','한국음악(국악)'],['CCCC','대중음악'],['EEEA','무용'],['EEEB','대중무용'],['GGGC','서커스/마술'],['GGG9','복합'],['JJJA','아동']];
let active='';
const $=s=>document.querySelector(s),grid=$('#grid'),count=$('#count');
$('#chips').innerHTML=categories.map((x,i)=>`<button class="chip ${i===0?'active':''}" data-id="${x[0]}">${x[1]}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active=b.dataset.id;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));load()});
$('#go').onclick=load;$('#q').onkeydown=e=>{if(e.key==='Enter')load()};$('#area').onchange=load;
$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('movoka-dark',document.body.classList.contains('dark'))};if(localStorage.getItem('movoka-dark')==='true')document.body.classList.add('dark');
$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function parse(xml){const doc=new DOMParser().parseFromString(xml,'text/xml');return [...doc.querySelectorAll('db')].map(n=>Object.fromEntries(['mt20id','prfnm','prfpdfrom','prfpdto','fcltynm','poster','genrenm','prfcast','prfurl'].map(k=>[k,n.querySelector(k)?.textContent||''])))}
function getRaw(xml){return new DOMParser().parseFromString(xml,'text/xml').querySelector('db')}
function card(x){return `<article class="card"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="${esc(x.prfnm)} 포스터" loading="lazy">`:'포스터 없음'}</div><div class="body"><div class="tag">${esc(x.genrenm||'공연')}</div><div class="title">${esc(x.prfnm||'공연명 미정')}</div><div class="meta"><div>📅 ${esc(x.prfpdfrom||'-')} ~ ${esc(x.prfpdto||'-')}</div><div>📍 ${esc(x.fcltynm||'-')}</div></div><div class="actions"><button onclick="showDetail('${esc(x.mt20id)}')">상세보기</button><button class="ticket" onclick="showTickets('${esc(x.mt20id)}','${esc(x.prfnm||'공연')}')">예매</button></div></div></article>`}
async function fetchDetailXml(id){const r=await fetch('/api/performance?mt20id='+encodeURIComponent(id));if(!r.ok)throw new Error();return await r.text()}
function ticketLinks(raw){return [...(raw?.querySelectorAll('relates relate')||[])].map(n=>({name:n.querySelector('relatenm')?.textContent?.trim()||'예매처',url:n.querySelector('relateurl')?.textContent?.trim()||''})).filter(x=>x.url&&/^https?:\/\//i.test(x.url))}
async function showTickets(id,name){$('#modal').classList.add('open');$('#detail').innerHTML='<p>공식 예매처를 확인하는 중입니다.</p>';try{const raw=getRaw(await fetchDetailXml(id));const links=ticketLinks(raw);if(!links.length){$('#detail').innerHTML=`<h2>${esc(name)}</h2><p>등록된 공식 예매처가 없습니다.</p>${raw?.querySelector('prfurl')?.textContent?`<a class="official" href="${esc(raw.querySelector('prfurl').textContent)}" target="_blank" rel="noopener noreferrer">KOPIS 공연정보</a>`:''}`;return}$('#detail').innerHTML=`<h2>${esc(name)}</h2><p>공연정보에 등록된 공식 예매처입니다.</p><div class="ticket-list">${links.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}<span>예매 페이지 ↗</span></a>`).join('')}</div>`}catch(e){$('#detail').innerHTML='<p>예매처 정보를 불러오지 못했습니다.</p>'}}
async function load(){grid.innerHTML='<div class="empty">공연 정보를 불러오는 중입니다.</div>';const p=new URLSearchParams({rows:'100'});if(active)p.set('shcate',active);if($('#area').value)p.set('signgucode',$('#area').value);const q=$('#q').value.trim();if(q)p.set('shprfnm',q);try{const r=await fetch('/api/performances?'+p);if(!r.ok)throw new Error();const data=parse(await r.text());count.textContent=`${data.length}개의 공연`;grid.innerHTML=data.length?data.map(card).join(''):'<div class="empty">조건에 맞는 공연이 없습니다.</div>'}catch(e){count.textContent='연결 대기';grid.innerHTML='<div class="empty">공연 정보를 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div>'}}
async function showDetail(id){$('#modal').classList.add('open');$('#detail').innerHTML='<p>공식 상세정보를 불러오는 중입니다.</p>';try{const raw=getRaw(await fetchDetailXml(id));const d=parse(new XMLSerializer().serializeToString(raw?.parentNode||raw))[0];if(!raw||!d)throw new Error();const get=k=>raw.querySelector(k)?.textContent||'';const img=get('poster')||d.poster;$('#detail').innerHTML=`<div class="detail"><div>${img?`<img src="${esc(img)}" alt="${esc(d.prfnm)} 포스터">`:''}</div><div><h2>${esc(d.prfnm)}</h2><dl><dt>장르</dt><dd>${esc(get('genrenm')||d.genrenm)}</dd><dt>기간</dt><dd>${esc(get('prfpdfrom')||d.prfpdfrom)} ~ ${esc(get('prfpdto')||d.prfpdto)}</dd><dt>공연장</dt><dd>${esc(get('fcltynm')||d.fcltynm)}</dd><dt>공연시간</dt><dd>${esc(get('prfruntime'))}</dd><dt>관람연령</dt><dd>${esc(get('prfage'))}</dd><dt>가격</dt><dd>${esc(get('pcseguidance'))}</dd><dt>출연진</dt><dd>${esc(get('prfcast')||d.prfcast)}</dd><dt>제작진</dt><dd>${esc(get('prfcrew'))}</dd></dl><p>${esc(get('sty'))}</p>${get('prfurl')?`<a class="official" href="${esc(get('prfurl'))}" target="_blank" rel="noopener noreferrer">KOPIS 공식 상세정보</a>`:''}</div></div>`}catch(e){$('#detail').innerHTML='<p>상세정보를 불러오지 못했습니다.</p>'}}
load();
</script>
</body>
</html>
