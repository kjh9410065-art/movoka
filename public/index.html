<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="연극, 뮤지컬, 클래식, 콘서트 등 공연정보를 한곳에서 찾는 MOVOKA">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://movoka.tcflick.com/">
<title>MOVOKA | 공연정보</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#171923;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1200px;margin:auto;padding:0 18px}header{border-bottom:1px solid #e5e7ee;background:#fff;position:sticky;top:0;z-index:5}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo b{color:#5b5bd6}.hero{padding:50px 0 30px}.hero h1{font-size:48px;line-height:1.1;margin:0 0 12px;letter-spacing:-3px}.hero p{color:#73798a;line-height:1.7}.search{display:flex;gap:8px;margin-top:24px}.search input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.search button{padding:0 22px;border:0;border-radius:12px;background:#5b5bd6;color:#fff;font-weight:800}.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.chip.active{background:#5b5bd6;color:#fff;border-color:#5b5bd6}.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7ee;border-radius:16px;overflow:hidden}.poster{aspect-ratio:3/4;background:#eef0f8;display:grid;place-items:center;color:#888}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.tag{font-size:11px;color:#5b5bd6;font-weight:800}.title{font-weight:900;font-size:16px;line-height:1.4;margin:7px 0}.meta{font-size:12px;color:#73798a;line-height:1.6}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:9px;border:1px solid #ddd;background:#fff;border-radius:9px;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#73798a;background:#fff;border:1px dashed #ddd;border-radius:16px}.pager{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:30px 0 60px}.page{min-width:38px;height:38px;border:1px solid #ddd;background:#fff;border-radius:9px}.page.active{background:#5b5bd6;color:#fff;border-color:#5b5bd6}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.hero h1{font-size:36px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo">MO<b>V</b>OKA</div><div>KOPIS 공연정보</div></div></header>
<main class="wrap">
<section class="hero"><h1>지금 볼 공연,<br>한곳에서 찾기.</h1><p>연극 · 뮤지컬 · 클래식 · 콘서트 · 무용 · 아동공연</p><div class="search"><input id="q" placeholder="공연명 검색"><button id="search">검색</button></div></section>
<div class="chips" id="chips"></div>
<div class="bar"><strong id="count">공연 정보를 불러오는 중...</strong><span>공식 KOPIS 데이터</span></div>
<section class="grid" id="grid"><div class="empty">공연 정보를 불러오는 중입니다.</div></section>
<div class="pager" id="pager"></div>
</main>
<script>
// MOVOKA의 기본 장르 목록입니다.
const categories=[['','전체'],['AAAA','연극'],['GGGA','뮤지컬'],['CCCA','서양음악(클래식)'],['CCCC','한국음악(국악)'],['CCCD','대중음악'],['BBBC','무용'],['KID','아동']];
let active='',all=[],page=1,totalPages=1;
const $=id=>document.getElementById(id);

// 장르 버튼을 화면에 만듭니다.
$('chips').innerHTML=categories.map((c,i)=>`<button class="chip ${i===0?'active':''}" data-id="${c[0]}">${c[1]}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;active=b.dataset.id;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));load()};
$('search').onclick=()=>load();
$('q').onkeydown=e=>{if(e.key==='Enter')load()};

// HTML 특수문자를 안전하게 표시합니다.
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

// 공연 카드를 만듭니다.
function card(x){return `<article class="card"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" loading="lazy" onerror="this.parentElement.textContent='포스터 없음'">`:'포스터 없음'}</div><div class="body"><div class="tag">${esc(x.genrenm||'공연')}</div><div class="title">${esc(x.prfnm)}</div><div class="meta">📅 ${esc(x.prfpdfrom)} ~ ${esc(x.prfpdto)}<br>📍 ${esc(x.fcltynm)}</div><div class="actions"><button onclick="detail('${esc(x.mt20id)}')">상세보기</button>${x.prfurl?`<button onclick="window.open('${esc(x.prfurl)}','_blank','noopener')">예매</button>`:''}</div></div></article>`}

// 현재 페이지의 공연을 화면에 표시합니다.
function render(){const start=(page-1)*28;const items=all.slice(start,start+28);$('grid').innerHTML=items.length?items.map(card).join(''):'<div class="empty">조건에 맞는 공연이 없습니다.</div>';$('count').textContent=`공연 ${all.length}개`;renderPager()}

// 전체 데이터를 로컬 페이지로 나눕니다.
function renderPager(){if(totalPages<=1){$('pager').innerHTML='';return}$('pager').innerHTML=Array.from({length:totalPages},(_,i)=>`<button class="page ${i+1===page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');$('pager').onclick=e=>{const b=e.target.closest('.page');if(!b)return;page=Number(b.dataset.page);render();scrollTo({top:0,behavior:'smooth'})}}

// KOPIS API를 호출해 100개 단위로 끝까지 가져옵니다.
async function load(){page=1;all=[];$('grid').innerHTML='<div class="empty">공연 정보를 불러오는 중입니다.</div>';$('count').textContent='공연 정보를 불러오는 중...';const q=new URLSearchParams();if(active)q.set('shcate',active);if($('q').value.trim())q.set('shprfnm',$('q').value.trim());try{for(let p=1;p<=100;p++){q.set('page',p);q.set('rows',100);const r=await fetch('/api/performances?'+q.toString(),{cache:'no-store'});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'공연 목록 요청 실패');all.push(...data.items);if(data.count<100)break}totalPages=Math.max(1,Math.ceil(all.length/28));render()}catch(e){$('grid').innerHTML=`<div class="empty">공연 정보를 불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`;$('count').textContent='불러오기 실패'}}

// 공연 상세정보를 KOPIS에서 받아 간단히 표시합니다.
async function detail(id){const r=await fetch('/api/performance?mt20id='+encodeURIComponent(id));const text=await r.text();if(!r.ok){alert(text);return}const doc=new DOMParser().parseFromString(text,'text/xml');const get=t=>doc.querySelector(t)?.textContent||'';alert(`${get('prfnm')}\n\n${get('prfpdfrom')} ~ ${get('prfpdto')}\n${get('fcltynm')}\n\n${get('prfcast')}`)}

// 페이지가 열리면 첫 조회를 시작합니다.
load();
</script>
</body>
</html>
