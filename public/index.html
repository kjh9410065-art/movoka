<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="연극, 뮤지컬, 클래식, 콘서트 등 공연정보를 한곳에서 찾는 MOVOKA">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://movoka.tcflick.com/">
<title>MOVOKA | 공연정보</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#171923;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1200px;margin:auto;padding:0 18px}header{border-bottom:1px solid #e5e7ee;background:#fff;position:sticky;top:0;z-index:5}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo b{color:#5b5bd6}.hero{padding:50px 0 25px}.hero h1{font-size:48px;line-height:1.1;margin:0 0 12px;letter-spacing:-3px}.hero p{color:#73798a;line-height:1.7}.search{display:flex;gap:8px;margin-top:24px}.search input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.search button{padding:0 22px;border:0;border-radius:12px;background:#5b5bd6;color:#fff;font-weight:800}.tabs{display:flex;gap:8px;margin:5px 0 18px}.tab{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.tab.active{background:#5b5bd6;color:#fff;border-color:#5b5bd6}.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;cursor:pointer}.chip.active{background:#5b5bd6;color:#fff;border-color:#5b5bd6}.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7ee;border-radius:16px;overflow:hidden}.poster{aspect-ratio:3/4;background:#eef0f8;display:grid;place-items:center;color:#888}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.tag{font-size:11px;color:#5b5bd6;font-weight:800}.title{font-weight:900;font-size:16px;line-height:1.4;margin:7px 0}.meta{font-size:12px;color:#73798a;line-height:1.6}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:9px;border:1px solid #ddd;background:#fff;border-radius:9px;font-size:12px;cursor:pointer}.actions .booking{background:#5b5bd6;color:#fff;border-color:#5b5bd6;font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#73798a;background:#fff;border:1px dashed #ddd;border-radius:16px}.pager{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:30px 0 60px}.page{min-width:38px;height:38px;border:1px solid #ddd;background:#fff;border-radius:9px;cursor:pointer}.page.active{background:#5b5bd6;color:#fff;border-color:#5b5bd6}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.hero h1{font-size:36px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo">MO<b>V</b>OKA</div><div>KOPIS 공연정보</div></div></header>
<main class="wrap">
<section class="hero"><h1>지금 볼 공연,<br>한곳에서 찾기.</h1><p>현재 공연 중이거나 공연 예정인 작품을 구분해서 보여드립니다.</p><div class="search"><input id="q" placeholder="공연명 검색"><button id="search">검색</button></div></section>
<div class="tabs"><button class="tab active" data-tab="current">현재 공연 <span id="currentCount">0</span></button><button class="tab" data-tab="upcoming">공연 예정 <span id="upcomingCount">0</span></button></div>
<div class="chips" id="chips"></div>
<div class="bar"><strong id="count">공연 정보를 불러오는 중...</strong><span id="updated">데이터 갱신 확인 중</span></div>
<section class="grid" id="grid"><div class="empty">공연 정보를 불러오는 중입니다.</div></section>
<div class="pager" id="pager"></div>
</main>
<script>
// MOVOKA에서 사용할 장르 목록입니다.
const categories=[['','전체'],['AAAA','연극'],['GGGA','뮤지컬'],['CCCA','서양음악(클래식)'],['CCCC','한국음악(국악)'],['CCCD','대중음악'],['BBBC','무용'],['KID','아동']];
let active='',tab='current',allCurrent=[],allUpcoming=[],page=1,totalPages=1;
const PAGE_SIZE=28;
const $=id=>document.getElementById(id);

// 장르 버튼을 화면에 만듭니다.
$('chips').innerHTML=categories.map((c,i)=>`<button class="chip ${i===0?'active':''}" data-id="${c[0]}">${c[1]}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;active=b.dataset.id;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));filterData()};

// 현재 공연과 공연 예정 탭을 전환합니다.
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.tab;page=1;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};
$('search').onclick=filterData;
$('q').onkeydown=e=>{if(e.key==='Enter')filterData()};

// HTML 특수문자를 안전하게 표시합니다.
function esc(v){return String(v||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}

// 예매사이트가 MOVOKA 자체 주소인지 확인하고 외부 주소만 허용합니다.
function validBookingUrl(url){try{const value=String(url||'').trim();if(!value)return '';const parsed=new URL(value,location.href);if(!/^https?:$/.test(parsed.protocol))return '';if(parsed.origin===location.origin)return '';return parsed.href}catch{return ''}}

// 예매사이트는 새 탭으로만 엽니다. 현재 MOVOKA 탭에는 절대 이동하지 않습니다.
function openBooking(url){const href=validBookingUrl(url);if(!href){alert('등록된 외부 예매사이트가 없습니다.');return}window.open(href,'_blank','noopener,noreferrer')}

// 저장된 주소가 MOVOKA 주소라면 무시하고 KOPIS에서 외부 예매사이트를 다시 찾습니다.
async function openBookingFor(id,storedUrl){
  const saved=validBookingUrl(storedUrl);
  if(saved){openBooking(saved);return}
  try{
    const response=await fetch('/api/performance?mt20id='+encodeURIComponent(id),{cache:'no-store'});
    const text=await response.text();
    if(!response.ok)throw new Error('예매사이트 정보를 불러오지 못했습니다.');
    const doc=new DOMParser().parseFromString(text,'text/xml');
    const relate=Array.from(doc.querySelectorAll('relateurl')).map(x=>x.textContent.trim()).map(validBookingUrl).find(Boolean);
    if(relate){openBooking(relate);return}
    alert('등록된 외부 예매사이트가 없습니다.');
  }catch(error){alert(error.message||'예매사이트 정보를 불러오지 못했습니다.')}
}

// 공연 카드에는 '예매사이트' 버튼을 표시합니다.
function card(x){return `<article class="card"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" loading="lazy" onerror="this.parentElement.textContent='포스터 없음'">`:'포스터 없음'}</div><div class="body"><div class="tag">${esc(x.genrenm||'공연')}</div><div class="title">${esc(x.prfnm)}</div><div class="meta">📅 ${esc(x.prfpdfrom)} ~ ${esc(x.prfpdto)}<br>📍 ${esc(x.fcltynm)}</div><div class="actions"><button onclick="detail('${esc(x.mt20id)}')">상세보기</button><button class="booking" onclick="openBookingFor('${esc(x.mt20id)}','${esc(x.bookingUrl||'')}')">예매사이트</button></div></div></article>`}

// 선택된 탭의 공연을 28개씩 화면에 표시합니다.
function render(){const source=tab==='upcoming'?allUpcoming:allCurrent;totalPages=Math.max(1,Math.ceil(source.length/PAGE_SIZE));if(page>totalPages)page=totalPages;const start=(page-1)*PAGE_SIZE;const items=source.slice(start,start+PAGE_SIZE);$('grid').innerHTML=items.length?items.map(card).join(''):'<div class="empty">조건에 맞는 공연이 없습니다.</div>'; $('count').textContent=tab==='upcoming'?`공연 예정 ${source.length}개`:`현재 공연 ${source.length}개`;renderPager()}

// 페이지 이동은 서버나 KOPIS를 다시 호출하지 않고 메모리에 받은 데이터를 사용합니다.
function renderPager(){if(totalPages<=1){$('pager').innerHTML='';return}$('pager').innerHTML=Array.from({length:totalPages},(_,i)=>`<button class="page ${i+1===page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');$('pager').onclick=e=>{const b=e.target.closest('.page');if(!b)return;page=Number(b.dataset.page);render();scrollTo({top:0,behavior:'smooth'})}}

// 장르와 검색어를 이미 받아둔 전체 데이터에 적용합니다.
function filterData(){const keyword=$('q').value.trim().toLowerCase();const filter=list=>list.filter(x=>(!active||x.genrenm===categories.find(c=>c[0]===active)?.[1])&&(!keyword||String(x.prfnm||'').toLowerCase().includes(keyword)));allCurrent=filter(window.__rawCurrent||[]);allUpcoming=filter(window.__rawUpcoming||[]);page=1;$('currentCount').textContent=allCurrent.length;$('upcomingCount').textContent=allUpcoming.length;render()}

// 저장된 일일 데이터 파일을 한 번만 읽습니다. 캐시된 이전 JSON을 피합니다.
async function load(){try{const response=await fetch('/data/performances.json?'+Date.now(),{cache:'no-store'});const data=await response.json();if(!response.ok||!data||!Array.isArray(data.items))throw new Error('저장된 공연 데이터가 없습니다.');window.__rawCurrent=data.current||[];window.__rawUpcoming=data.upcoming||[];$('updated').textContent=data.updatedAt?`마지막 갱신 ${new Date(data.updatedAt).toLocaleString('ko-KR')}`:'갱신 대기 중';filterData()}catch(e){$('grid').innerHTML=`<div class="empty">공연 정보를 불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`;$('count').textContent='불러오기 실패'}}

// 공연 상세정보는 사용자가 상세보기를 누를 때만 Worker API를 호출합니다.
async function detail(id){const r=await fetch('/api/performance?mt20id='+encodeURIComponent(id));const text=await r.text();if(!r.ok){alert(text);return}const doc=new DOMParser().parseFromString(text,'text/xml');const get=t=>doc.querySelector(t)?.textContent||'';alert(`${get('prfnm')}\n\n${get('prfpdfrom')} ~ ${get('prfpdto')}\n${get('fcltynm')}\n\n${get('prfcast')}`)}

// 페이지가 열리면 저장된 일일 데이터만 읽습니다.
load();
</script>
</body>
</html>
